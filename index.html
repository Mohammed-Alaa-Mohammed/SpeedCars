<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>عداد السرعة الحقيقي - GPS</title>
    <!-- Bootstrap RTL CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.rtl.min.css">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: linear-gradient(135deg, #0b0b1f 0%, #1a1a3a 100%);
            min-height: 100vh;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: white;
            overflow-x: hidden;
            padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
        }

        /* Header */
        .gps-header {
            background: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            padding: 15px;
            position: sticky;
            top: 0;
            z-index: 1000;
        }

        .satellite-info {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 0.9rem;
            color: #00ff88;
        }

        .satellite-info i {
            font-size: 1.2rem;
        }

        /* Speedometer Main */
        .speedometer-main {
            padding: 20px;
            margin-top: 10px;
        }

        .speed-circle {
            position: relative;
            width: 100%;
            max-width: 400px;
            margin: 0 auto;
            aspect-ratio: 1;
        }

        .speed-bg {
            position: absolute;
            width: 100%;
            height: 100%;
            border-radius: 50%;
            background: conic-gradient(
                from 135deg,
                #00ff00 0deg 90deg,
                #ffff00 90deg 180deg,
                #ff8800 180deg 240deg,
                #ff0000 240deg 270deg
            );
            mask: radial-gradient(circle at center, transparent 60%, black 61%);
            -webkit-mask: radial-gradient(circle at center, transparent 60%, black 61%);
            opacity: 0.3;
        }

        .speed-indicator {
            position: absolute;
            width: 100%;
            height: 100%;
            border-radius: 50%;
            background: conic-gradient(
                from 135deg,
                #00ff00 0deg 0deg,
                #ffff00 0deg 0deg,
                #ff8800 0deg 0deg,
                #ff0000 0deg 0deg
            );
            mask: radial-gradient(circle at center, transparent 60%, black 61%);
            -webkit-mask: radial-gradient(circle at center, transparent 60%, black 61%);
            transition: all 0.1s ease;
        }

        .speed-inner {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 70%;
            height: 70%;
            background: linear-gradient(145deg, #0f0f1f, #1a1a2f);
            border-radius: 50%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            box-shadow: inset 0 0 50px rgba(0, 0, 0, 0.8), 0 0 30px rgba(0, 255, 255, 0.3);
            border: 3px solid rgba(255, 255, 255, 0.1);
        }

        .current-speed {
            font-size: 5rem;
            font-weight: 900;
            color: #fff;
            text-shadow: 0 0 30px rgba(0, 255, 255, 0.7);
            line-height: 1;
            font-family: 'Arial Black', sans-serif;
        }

        .speed-unit {
            font-size: 1.2rem;
            color: rgba(255, 255, 255, 0.7);
            margin-top: 5px;
        }

        .speed-needle {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 40%;
            height: 4px;
            background: linear-gradient(90deg, #fff, #ffaa00);
            transform-origin: left center;
            transform: rotate(-45deg);
            border-radius: 4px;
            box-shadow: 0 0 20px #ffaa00;
            z-index: 10;
            transition: transform 0.1s ease-out;
        }

        .needle-center {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 20px;
            height: 20px;
            background: #ffaa00;
            border-radius: 50%;
            transform: translate(-50%, -50%);
            box-shadow: 0 0 30px #ffaa00;
            z-index: 11;
            border: 3px solid white;
        }

        /* GPS Status */
        .gps-status {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border-radius: 50px;
            padding: 15px 25px;
            margin: 20px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .status-led {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: #ff0000;
            box-shadow: 0 0 10px #ff0000;
            animation: blink 1s infinite;
        }

        .status-led.active {
            background: #00ff00;
            box-shadow: 0 0 20px #00ff00;
            animation: none;
        }

        @keyframes blink {
            0% { opacity: 1; }
            50% { opacity: 0.3; }
            100% { opacity: 1; }
        }

        /* Info Cards */
        .info-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
            padding: 15px;
        }

        .info-card {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 20px 15px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            text-align: center;
        }

        .info-card i {
            font-size: 1.8rem;
            color: #00ffff;
            margin-bottom: 10px;
        }

        .info-label {
            font-size: 0.9rem;
            color: rgba(255, 255, 255, 0.6);
            margin-bottom: 5px;
        }

        .info-value {
            font-size: 1.8rem;
            font-weight: bold;
            color: white;
        }

        .info-unit {
            font-size: 0.8rem;
            color: rgba(255, 255, 255, 0.4);
            margin-right: 5px;
        }

        /* Trip Info */
        .trip-info {
            background: rgba(0, 0, 0, 0.3);
            border-radius: 20px;
            padding: 20px;
            margin: 15px;
        }

        .trip-stats {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin-top: 15px;
        }

        .trip-stat {
            text-align: center;
        }

        .trip-stat-value {
            font-size: 1.4rem;
            font-weight: bold;
            color: #00ffff;
        }

        .trip-stat-label {
            font-size: 0.8rem;
            color: rgba(255, 255, 255, 0.5);
        }

        /* Control Buttons */
        .control-buttons {
            display: flex;
            justify-content: center;
            gap: 20px;
            padding: 20px;
            margin-bottom: 20px;
        }

        .btn-control {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.1);
            border: 2px solid rgba(255, 255, 255, 0.2);
            color: white;
            font-size: 1.5rem;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s ease;
        }

        .btn-control:active {
            transform: scale(0.95);
            background: rgba(255, 255, 255, 0.2);
        }

        .btn-control.start {
            background: #00ff00;
            color: black;
            border-color: #00ff00;
        }

        .btn-control.stop {
            background: #ff0000;
            color: white;
            border-color: #ff0000;
        }

        /* Warning Banner */
        .warning-banner {
            background: rgba(255, 0, 0, 0.8);
            backdrop-filter: blur(10px);
            color: white;
            padding: 15px;
            text-align: center;
            font-size: 1.2rem;
            font-weight: bold;
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            transform: translateY(100%);
            transition: transform 0.3s ease;
            z-index: 2000;
        }

        .warning-banner.show {
            transform: translateY(0);
        }

        /* Permissions Dialog */
        .permissions-dialog {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.9);
            backdrop-filter: blur(10px);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 3000;
            padding: 20px;
        }

        .dialog-content {
            background: linear-gradient(145deg, #1a1a2f, #0f0f1f);
            border-radius: 30px;
            padding: 30px;
            text-align: center;
            max-width: 350px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .dialog-content i {
            font-size: 4rem;
            color: #00ffff;
            margin-bottom: 20px;
        }

        .dialog-content h3 {
            margin-bottom: 15px;
        }

        .dialog-content p {
            color: rgba(255, 255, 255, 0.7);
            margin-bottom: 25px;
        }

        .btn-permission {
            background: #00ffff;
            color: black;
            border: none;
            border-radius: 50px;
            padding: 15px 40px;
            font-size: 1.2rem;
            font-weight: bold;
            width: 100%;
            cursor: pointer;
        }

        .accuracy-badge {
            font-size: 0.8rem;
            padding: 3px 10px;
            border-radius: 50px;
            background: rgba(255, 255, 255, 0.1);
        }

        /* Responsive */
        @media (max-width: 380px) {
            .current-speed {
                font-size: 4rem;
            }
            
            .info-value {
                font-size: 1.4rem;
            }
        }
    </style>
</head>
<body>
    <!-- Permissions Dialog -->
    <div class="permissions-dialog" id="permissionsDialog">
        <div class="dialog-content">
            <i class="fas fa-satellite-dish"></i>
            <h3>تفعيل GPS</h3>
            <p>لقياس سرعة السيارة بدقة، يرجى السماح بتفعيل خدمة الموقع</p>
            <button class="btn-permission" onclick="requestPermissions()">
                <i class="fas fa-check ms-2"></i>
                تفعيل GPS
            </button>
        </div>
    </div>

    <!-- Header -->
    <div class="gps-header">
        <div class="d-flex justify-content-between align-items-center">
            <div class="satellite-info" id="gpsInfo">
                <i class="fas fa-satellite"></i>
                <span>البحث عن إشارة GPS...</span>
            </div>
            <div class="d-flex align-items-center gap-3">
                <span class="accuracy-badge" id="accuracyBadge">
                    <i class="fas fa-crosshairs ms-1"></i>
                    دقة: -- م
                </span>
                <div class="status-led" id="gpsLed"></div>
            </div>
        </div>
    </div>

    <!-- Main Speedometer -->
    <div class="speedometer-main">
        <div class="speed-circle">
            <div class="speed-bg"></div>
            <div class="speed-indicator" id="speedIndicator"></div>
            <div class="speed-needle" id="speedNeedle"></div>
            <div class="needle-center"></div>
            <div class="speed-inner">
                <div class="current-speed" id="currentSpeed">0</div>
                <div class="speed-unit">كم/س</div>
            </div>
        </div>
    </div>

    <!-- GPS Status -->
    <div class="gps-status">
        <div class="d-flex justify-content-between align-items-center">
            <div>
                <i class="fas fa-map-pin ms-2 text-info"></i>
                <span id="gpsStatus">في انتظار إشارة GPS...</span>
            </div>
            <div>
                <span class="badge bg-info" id="satelliteCount">0 أقمار</span>
            </div>
        </div>
    </div>

    <!-- Info Grid -->
    <div class="info-grid">
        <div class="info-card">
            <i class="fas fa-arrow-up"></i>
            <div class="info-label">أقصى سرعة</div>
            <div class="info-value" id="maxSpeed">0</div>
            <span class="info-unit">كم/س</span>
        </div>
        <div class="info-card">
            <i class="fas fa-chart-line"></i>
            <div class="info-label">متوسط السرعة</div>
            <div class="info-value" id="avgSpeed">0</div>
            <span class="info-unit">كم/س</span>
        </div>
        <div class="info-card">
            <i class="fas fa-road"></i>
            <div class="info-label">المسافة</div>
            <div class="info-value" id="distance">0.0</div>
            <span class="info-unit">كم</span>
        </div>
        <div class="info-card">
            <i class="fas fa-clock"></i>
            <div class="info-label">الوقت</div>
            <div class="info-value" id="tripTime">00:00</div>
            <span class="info-unit"></span>
        </div>
    </div>

    <!-- Trip Information -->
    <div class="trip-info">
        <h5 class="mb-3">
            <i class="fas fa-location-dot ms-2 text-info"></i>
            معلومات الرحلة
        </h5>
        <div class="trip-stats">
            <div class="trip-stat">
                <div class="trip-stat-value" id="altitude">0</div>
                <div class="trip-stat-label">الارتفاع (م)</div>
            </div>
            <div class="trip-stat">
                <div class="trip-stat-value" id="heading">0°</div>
                <div class="trip-stat-label">الاتجاه</div>
            </div>
            <div class="trip-stat">
                <div class="trip-stat-value" id="accuracy">0</div>
                <div class="trip-stat-label">الدقة (م)</div>
            </div>
        </div>
    </div>

    <!-- Control Buttons -->
    <div class="control-buttons">
        <button class="btn-control" onclick="resetTrip()">
            <i class="fas fa-undo-alt"></i>
        </button>
        <button class="btn-control start" id="startBtn" onclick="startTracking()">
            <i class="fas fa-play"></i>
        </button>
        <button class="btn-control stop" id="stopBtn" onclick="stopTracking()" disabled>
            <i class="fas fa-stop"></i>
        </button>
    </div>

    <!-- Warning Banner -->
    <div class="warning-banner" id="warningBanner">
        <i class="fas fa-exclamation-triangle ms-2"></i>
        <span id="warningMessage">تحذير! سرعة عالية جداً</span>
    </div>

    <script>
        // Global variables
        let watchId = null;
        let isTracking = false;
        let startTime = null;
        let maxSpeedRecorded = 0;
        let totalDistance = 0;
        let lastPosition = null;
        let speedHistory = [];
        let updateInterval;
        
        // Speed limits
        const WARNING_SPEED = 140; // كم/ساعة
        const MAX_SPEED = 240; // كم/ساعة

        // DOM elements
        const currentSpeedEl = document.getElementById('currentSpeed');
        const speedNeedle = document.getElementById('speedNeedle');
        const speedIndicator = document.getElementById('speedIndicator');
        const maxSpeedEl = document.getElementById('maxSpeed');
        const avgSpeedEl = document.getElementById('avgSpeed');
        const distanceEl = document.getElementById('distance');
        const tripTimeEl = document.getElementById('tripTime');
        const gpsStatusEl = document.getElementById('gpsStatus');
        const gpsLed = document.getElementById('gpsLed');
        const satelliteCountEl = document.getElementById('satelliteCount');
        const accuracyBadge = document.getElementById('accuracyBadge');
        const altitudeEl = document.getElementById('altitude');
        const headingEl = document.getElementById('heading');
        const accuracyEl = document.getElementById('accuracy');
        const warningBanner = document.getElementById('warningBanner');
        const warningMessage = document.getElementById('warningMessage');
        const permissionsDialog = document.getElementById('permissionsDialog');
        const startBtn = document.getElementById('startBtn');
        const stopBtn = document.getElementById('stopBtn');

        // Check if browser supports geolocation
        function checkGPSSupport() {
            if (!navigator.geolocation) {
                showError("جهازك لا يدعم خدمة GPS");
                return false;
            }
            return true;
        }

        // Request permissions
        function requestPermissions() {
            if (!checkGPSSupport()) return;

            navigator.geolocation.getCurrentPosition(
                // Success callback
                (position) => {
                    permissionsDialog.style.display = 'none';
                    startTracking();
                },
                // Error callback
                (error) => {
                    handleGPSError(error);
                },
                {
                    enableHighAccuracy: true,
                    timeout: 10000,
                    maximumAge: 0
                }
            );
        }

        // Handle GPS errors
        function handleGPSError(error) {
            let message = '';
            switch(error.code) {
                case error.PERMISSION_DENIED:
                    message = 'تم رفض الإذن بالوصول إلى GPS';
                    break;
                case error.POSITION_UNAVAILABLE:
                    message = 'معلومات الموقع غير متوفرة';
                    break;
                case error.TIMEOUT:
                    message = 'انتهى وقت محاولة الاتصال بـ GPS';
                    break;
                default:
                    message = 'خطأ غير معروف في GPS';
            }
            gpsStatusEl.textContent = message;
            gpsLed.className = 'status-led';
        }

        // Start tracking
        function startTracking() {
            if (!checkGPSSupport()) return;

            permissionsDialog.style.display = 'none';
            
            watchId = navigator.geolocation.watchPosition(
                updateSpeed,
                handleGPSError,
                {
                    enableHighAccuracy: true,
                    timeout: 5000,
                    maximumAge: 0
                }
            );

            isTracking = true;
            startTime = Date.now();
            startBtn.disabled = true;
            stopBtn.disabled = false;
            
            // Update trip time every second
            updateInterval = setInterval(updateTripTime, 1000);
            
            gpsStatusEl.textContent = 'جارٍ التتبع...';
        }

        // Stop tracking
        function stopTracking() {
            if (watchId) {
                navigator.geolocation.clearWatch(watchId);
                watchId = null;
            }
            
            isTracking = false;
            startBtn.disabled = false;
            stopBtn.disabled = true;
            
            clearInterval(updateInterval);
            
            gpsStatusEl.textContent = 'تم إيقاف التتبع';
            gpsLed.className = 'status-led';
        }

        // Update speed from GPS
        function updateSpeed(position) {
            const speed = position.coords.speed; // سرعة بالمتر/ثانية
            
            // تحديث مؤشر GPS
            gpsLed.className = 'status-led active';
            
            // تحديث عدد الأقمار (غير متوفر مباشرة في API)
            satelliteCountEl.textContent = '3+ أقمار';
            
            // تحديث دقة الموقع
            const accuracy = Math.round(position.coords.accuracy);
            accuracyEl.textContent = accuracy;
            accuracyBadge.innerHTML = `<i class="fas fa-crosshairs ms-1"></i>دقة: ${accuracy} م`;
            
            // تحديث الارتفاع
            if (position.coords.altitude !== null) {
                altitudeEl.textContent = Math.round(position.coords.altitude);
            }
            
            // تحديث الاتجاه
            if (position.coords.heading !== null) {
                headingEl.textContent = Math.round(position.coords.heading) + '°';
            }
            
            if (speed !== null && speed >= 0) {
                // تحويل من متر/ثانية إلى كم/ساعة
                const speedKmh = speed * 3.6;
                
                // تحديث عداد السرعة
                updateSpeedDisplay(speedKmh);
                
                // حساب المسافة المقطوعة
                if (lastPosition && isTracking) {
                    const distance = calculateDistance(
                        lastPosition.coords.latitude,
                        lastPosition.coords.longitude,
                        position.coords.latitude,
                        position.coords.longitude
                    );
                    totalDistance += distance;
                    distanceEl.textContent = totalDistance.toFixed(1);
                }
                
                // حفظ آخر موقع
                lastPosition = position;
                
                // إضافة إلى سجل السرعات
                speedHistory.push(speedKmh);
                if (speedHistory.length > 100) speedHistory.shift();
                
                // تحديث متوسط السرعة
                updateAverageSpeed();
                
                // تحديث أقصى سرعة
                if (speedKmh > maxSpeedRecorded) {
                    maxSpeedRecorded = speedKmh;
                    maxSpeedEl.textContent = Math.round(maxSpeedRecorded);
                }
                
                // التحقق من السرعة الزائدة
                checkOverspeed(speedKmh);
            } else {
                currentSpeedEl.textContent = '0';
                speedNeedle.style.transform = 'rotate(-45deg)';
                warningBanner.classList.remove('show');
            }
            
            // تحديث حالة GPS
            gpsStatusEl.textContent = `السرعة: ${currentSpeedEl.textContent} كم/س`;
        }

        // Update speed display
        function updateSpeedDisplay(speed) {
            // تحديث الرقم
            currentSpeedEl.textContent = Math.round(speed);
            
            // تحديث الإبرة (من -45° إلى 225°)
            const maxAngle = 270; // إجمالي زاوية الحركة
            const startAngle = -45; // زاوية البداية
            const angle = startAngle + (speed / MAX_SPEED) * maxAngle;
            speedNeedle.style.transform = `rotate(${angle}deg)`;
            
            // تحديث المؤشر الملون
            const percentage = (speed / MAX_SPEED) * 100;
            const indicatorAngle = (percentage / 100) * 270;
            speedIndicator.style.background = `conic-gradient(
                from 135deg,
                #00ff00 0deg ${indicatorAngle}deg,
                transparent ${indicatorAngle}deg 360deg
            )`;
        }

        // Calculate distance between two coordinates (Haversine formula)
        function calculateDistance(lat1, lon1, lat2, lon2) {
            const R = 6371; // نصف قطر الأرض بالكيلومتر
            const dLat = (lat2 - lat1) * Math.PI / 180;
            const dLon = (lon2 - lon1) * Math.PI / 180;
            const a = 
                Math.sin(dLat/2) * Math.sin(dLat/2) +
                Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) * 
                Math.sin(dLon/2) * Math.sin(dLon/2);
            const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
            return R * c;
        }

        // Update average speed
        function updateAverageSpeed() {
            if (speedHistory.length > 0) {
                const sum = speedHistory.reduce((a, b) => a + b, 0);
                const avg = sum / speedHistory.length;
                avgSpeedEl.textContent = Math.round(avg);
            }
        }

        // Update trip time
        function updateTripTime() {
            if (startTime && isTracking) {
                const elapsed = Math.floor((Date.now() - startTime) / 1000);
                const minutes = Math.floor(elapsed / 60);
                const seconds = elapsed % 60;
                tripTimeEl.textContent = `${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}`;
            }
        }

        // Check for overspeed
        function checkOverspeed(speed) {
            if (speed > WARNING_SPEED) {
                warningBanner.classList.add('show');
                warningMessage.textContent = `تحذير! السرعة عالية جداً (${Math.round(speed)} كم/س)`;
                
                // اهتزاز إذا كان مدعوماً
                if (navigator.vibrate) {
                    navigator.vibrate([500, 200, 500]);
                }
            } else {
                warningBanner.classList.remove('show');
            }
        }

        // Reset trip
        function resetTrip() {
            if (isTracking) {
                stopTracking();
            }
            
            // إعادة تعيين جميع القيم
            maxSpeedRecorded = 0;
            totalDistance = 0;
            speedHistory = [];
            lastPosition = null;
            startTime = null;
            
            // تحديث العرض
            currentSpeedEl.textContent = '0';
            maxSpeedEl.textContent = '0';
            avgSpeedEl.textContent = '0';
            distanceEl.textContent = '0.0';
            tripTimeEl.textContent = '00:00';
            speedNeedle.style.transform = 'rotate(-45deg)';
            speedIndicator.style.background = 'conic-gradient(from 135deg, transparent 0deg 360deg)';
            warningBanner.classList.remove('show');
            
            gpsStatusEl.textContent = 'تم إعادة التعيين';
        }

        // Show error message
        function showError(message) {
            gpsStatusEl.textContent = message;
            console.error(message);
        }

        // Initialize
        document.addEventListener('DOMContentLoaded', function() {
            // إخفاء مربع الأذونات إذا كان GPS غير مدعوم
            if (!navigator.geolocation) {
                permissionsDialog.style.display = 'none';
                showError('جهازك لا يدعم خدمة GPS');
            }
        });

        // Cleanup on page unload
        window.addEventListener('beforeunload', function() {
            if (watchId) {
                navigator.geolocation.clearWatch(watchId);
            }
        });
    </script>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
